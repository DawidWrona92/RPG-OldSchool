<text x="408" y="443" font-family="sans-serif" font-size="23" font-weight="bold" fill="white">WÓZ</text>
<ellipse cx="653" cy="438" rx="38" ry="25" fill="#8a5539" stroke="#30251f" stroke-width="3"/><text x="638" y="444" font-family="sans-serif" font-size="15" font-weight="bold" fill="white">KOŃ</text>
<line x1="595" y1="417" x2="618" y2="417" stroke="#423225" stroke-width="5"/><line x1="595" y1="461" x2="618" y2="461" stroke="#423225" stroke-width="5"/>
