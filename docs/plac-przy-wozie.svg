<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Plac przy wozie — schemat roboczy z góry</title>
<desc id="desc">Wóz na leśnym trakcie, dwa obejścia, koń, buty i pakunki, wejście prologu, przejście do rozstaju oraz strefa psa przy powrocie.</desc>
<rect width="1200" height="850" fill="#f3efe5"/>
<text x="38" y="48" font-family="sans-serif" font-weight="bold" font-size="27" fill="#1e302a">Plac przy wozie — plan z góry</text>
<text x="38" y="75" font-family="sans-serif" font-size="16" fill="#3d4a43">Propozycja do blockoutu • bez skali i bez ustalonych kierunków geograficznych</text>
