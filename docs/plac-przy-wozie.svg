<text x="77" y="154" font-family="sans-serif" font-size="14" fill="white">ODNOGA: BRZEG*</text><text x="581" y="154" font-family="sans-serif" font-size="14" fill="white">ŚCIEŻKA PĘTLI*</text>
<g font-family="sans-serif" fill="#203129"><text x="850" y="135" font-size="22" font-weight="bold">Legenda</text><text x="850" y="180" font-size="17">B — buty przy kole</text><text x="850" y="211" font-size="17">P — pakunki / księga</text><text x="850" y="252" font-size="17">Żółte: dwie trasy</text><text x="850" y="280" font-size="17">obejścia do przetestowania</text><text x="850" y="325" font-size="17">Czerwone: orientacyjna</text><text x="850" y="353" font-size="17">strefa Psa rano</text><text x="850" y="400" font-size="17">Jasne: kandydat na</text><text x="850" y="428" font-size="17">przestrzeń do uniku</text><text x="850" y="482" font-size="16">* Odnogi i zachowanie</text><text x="850" y="510" font-size="16">granic wymagają walidacji.</text><text x="850" y="556" font-size="16">Symboliczne pozycje</text><text x="850" y="584" font-size="16">nie są kolizjami ani</text><text x="850" y="612" font-size="16">rzeczywistymi wymiarami.</text><text x="850" y="670" font-size="16">Światło znajduje się dalej</text><text x="850" y="698" font-size="16">w stronę rozstaju i bramy.</text></g>
<text x="38" y="825" font-family="sans-serif" font-size="15" fill="#405049">Koniec zaprzęgu i dostępność obu obejść zweryfikować w blockoucie, kamerze gry i nawigacji.</text>
</svg>
