<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niemir 1:1 — brama i osada</title>
<style>
:root { --bg: #07090f; --accent: #ffb347; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(1200px 700px at 50% 20%, #10141f 0%, var(--bg) 70%);
  font-family: "Courier New", ui-monospace, monospace;
  color: #c8d3e0;
}
.stage { width: min(96vw, 1400px); text-align: center; padding: 16px 0 24px; }
h1 { font-size: 18px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.frame {
  position: relative; display: inline-block; width: 100%;
  border: 3px solid #2a2233; border-radius: 4px;
  box-shadow: 0 0 0 2px #0b0d14, 0 18px 60px rgba(0,0,0,.8);
  overflow: hidden;
}
canvas { display: block; width: 100%; background: #0a0c12; }
.hud {
  position: absolute; left: 10px; bottom: 8px; font-size: 12px; letter-spacing: 1px;
  color: #9fb2c8; background: rgba(5,8,16,.7);
  border: 1px solid rgba(160,180,210,.25); padding: 4px 8px; pointer-events: none;
}
.key { display: inline-block; border: 1px solid #55627a; border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; color: var(--accent); }
.foot { margin-top: 10px; font-size: 12px; color: #6d7c92; }
</style>
</head>
<body>
<main class="stage">
  <h1>Niemir 1:1 — brama i osada</h1>
  <div class="frame">
    <canvas id="game" width="960" height="600"></canvas>
    <div class="hud">
      <span class="key">W A S D</span> / <span class="key">strzałki</span> — chodzenie
      &nbsp;·&nbsp; <span class="key">Shift</span> — bieg
      &nbsp;·&nbsp; do góry pod bramą = przejście do osady
    </div>
  </div>
  <p class="foot">Tło: oryginalne kadry 1:1 (statyczne). Postacie animowane: oddech + para z ust. Dwie sceny z przejściem.</p>
</main>
<script src="game.js"></script>
</body>
</html>
